    <path d="M96 46 L96 66" fill="none" stroke="url(#woGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M96 46 L116 46" fill="none" stroke="url(#woGrad)" stroke-width="12" stroke-linecap="round"/>

    <circle cx="122" cy="38" r="6" fill="#00E6A8"/>
